name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests (Jest)
        run: npm test -- --ci

      - name: Typecheck (tsc)
        run: npx tsc --noEmit
        # Còn đúng 1 lỗi đã biết: app/_layout.tsx(44,35) props của <StatusBar>.
        # File khởi động của app, team quy ước không sửa tự động. Khi đã sửa thì bỏ dòng dưới
        # để typecheck trở thành bước bắt buộc.
        continue-on-error: true
